services:
  # Backend API
  - type: web
    name: bot-lummic-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx prisma generate --schema=./backend/prisma/schema.prisma && npx prisma migrate deploy --schema=./backend/prisma/schema.prisma
    startCommand: npx tsx backend/src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: bot-lummic-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: VITE_API_URL
        sync: false
